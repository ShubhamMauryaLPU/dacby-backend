name: Order Status Scheduler

on:
  workflow_dispatch:

jobs:
  trigger-scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Call scheduler endpoint
        run: |
          curl --fail-with-body \
            -X POST "${{ secrets.BACKEND_URL }}/api/v1/scheduler/run-status-update" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET_KEY }}" \
            -H "Content-Type: application/json"